
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltienerg | Contacto</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="container py-4">
        <h1>Voltienerg</h1>
        <p>Energía inteligente.</p>

        <nav class="d-flex flex-wrap gap-3">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="container py-4">
        <section class="mb-4">
            <h2>Contáctanos</h2>
            <p>
                ¿Tienes preguntas sobre nuestros equipos eficientes?
                Escríbenos y te ayudaremos.
            </p>
        </section>

        <form class="card shadow p-4" action="#" method="post">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre"
                    name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo"
                    name="correo" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono"
                    name="telefono" required>
            </div>

            <div class="mb-3">
                <label for="asunto" class="form-label">Asunto</label>
                <select class="form-select" id="asunto" name="asunto" required>
                    <option value="">Selecciona una opción</option>
                    <option value="productos">Información de productos</option>
                    <option value="precios">Precios</option>
                    <option value="asesoria">Asesoría</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje"
                    name="mensaje" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-success">
                Enviar mensaje
            </button>

        </form>
    </main>

    <footer class="container py-4">
        <p>Voltienerg - Energía inteligente.</p>
    </footer>

</body>
</html>
